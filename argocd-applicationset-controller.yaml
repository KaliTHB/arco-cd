apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-applicationset-controller
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-applicationset-controller
    app.kubernetes.io/part-of: argocd
 
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-applicationset-controller
  labels:
    app.kubernetes.io/name: argocd-applicationset-controller
    app.kubernetes.io/part-of: argocd
rules:
 
  # ApplicationSets
  - apiGroups:
      - argoproj.io
    resources:
      - applicationsets
      - applicationsets/status
      - applicationsets/finalizers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
 
  # Applications
  - apiGroups:
      - argoproj.io
    resources:
      - applications
      - applications/status
      - applications/finalizers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
 
  # AppProjects
  - apiGroups:
      - argoproj.io
    resources:
      - appprojects
      - appprojects/status
    verbs:
      - get
      - list
      - watch
 
  # Secrets and ConfigMaps
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
    verbs:
      - get
      - list
      - watch
 
  # Namespaces
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
 
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-applicationset-controller
  labels:
    app.kubernetes.io/name: argocd-applicationset-controller
    app.kubernetes.io/part-of: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-applicationset-controller
subjects:
  - kind: ServiceAccount
    name: argocd-applicationset-controller
    namespace: argocd
 
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applicationsets.argoproj.io
spec:
  group: argoproj.io
  names:
    kind: ApplicationSet
    listKind: ApplicationSetList
    plural: applicationsets
    singular: applicationset
    shortNames:
      - appset
      - appsets
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
 
---
 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-applicationset-controller
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-applicationset-controller
    app.kubernetes.io/part-of: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-applicationset-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-applicationset-controller
        app.kubernetes.io/part-of: argocd
    spec:
      serviceAccountName: argocd-applicationset-controller
 
      containers:
        - name: applicationset-controller
          image: corpusacrdevtestindd360genai.azurecr.io/argoproj/argocd:v3.1.0
          imagePullPolicy: Always
 
          command:
            - /usr/local/bin/argocd-applicationset-controller
 
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
 
            - name: webhook
              containerPort: 7000
              protocol: TCP
 
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
 
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-applicationset-controller
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-applicationset-controller
    app.kubernetes.io/part-of: argocd
spec:
  type: ClusterIP
 
  selector:
    app.kubernetes.io/name: argocd-applicationset-controller
 
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
 
    - name: webhook
      port: 7000
      targetPort: 7000
      protocol: TCP
