apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-dex-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-dex-server
    app.kubernetes.io/part-of: argocd
 
---
 
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-dex-server-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-dex-server
    app.kubernetes.io/part-of: argocd
 
data:
  config.yaml: |
    issuer: http://argocd-dex-server:5556
 
    storage:
      type: memory
 
    web:
      http: 0.0.0.0:5556
 
    grpc:
      addr: 0.0.0.0:5557
 
    logger:
      level: info
      format: text
 
    connectors:
      - type: mockCallback
        id: mock
        name: Mock
        config: {}
 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-dex-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-dex-server
    app.kubernetes.io/part-of: argocd
 
spec:
  replicas: 1
 
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-dex-server
 
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-dex-server
        app.kubernetes.io/part-of: argocd
 
    spec:
      serviceAccountName: argocd-dex-server
 
      containers:
        - name: dex
          image: corpusacrdevtestindd360genai.azurecr.io/platform/dexidp/dex:v2.45.1
          imagePullPolicy: Always
 
          command:
            - /usr/local/bin/dex
 
          args:
            - serve
            - /shared/config/dex/config.yaml
 
          ports:
            - name: http
              containerPort: 5556
              protocol: TCP
 
            - name: grpc
              containerPort: 5557
              protocol: TCP
 
          volumeMounts:
            - name: dex-config
              mountPath: /shared/config/dex
              readOnly: true
 
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5556
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
 
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5556
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
 
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
 
      volumes:
        - name: dex-config
          configMap:
            name: argocd-dex-server-config
            items:
              - key: config.yaml
                path: config.yaml
 
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-dex-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-dex-server
    app.kubernetes.io/part-of: argocd
 
spec:
  type: ClusterIP
 
  selector:
    app.kubernetes.io/name: argocd-dex-server
 
  ports:
    - name: http
      port: 5556
      targetPort: 5556
      protocol: TCP
 
    - name: grpc
      port: 5557
      targetPort: 5557
      protocol: TCP
