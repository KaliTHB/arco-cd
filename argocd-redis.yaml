apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-redis
    app.kubernetes.io/part-of: argocd

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-redis

  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-redis
        app.kubernetes.io/part-of: argocd

    spec:
      containers:
        - name: redis
          image: corpusacrdevtestindd360genai.azurecr.io/redis:7.2.7-alpine
          imagePullPolicy: Always

          args:
            - --save
            - ""
            - --appendonly
            - "no"

          ports:
            - name: redis
              containerPort: 6379

          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: argocd-redis
  namespace: argocd

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: argocd-redis

  ports:
    - name: redis
      port: 6379
      targetPort: 6379
